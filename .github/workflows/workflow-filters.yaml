name: Workflow Filters and Activities

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/59 * * * *"
  push:
    branches:
      - main
      - '!feature/*'    # ignoring push to any branch starting with feature by using !
    # branches-ignore:
    #   - feature/*     # feature/add-music, feature/updateImages
    #   - test/**       # test/ui/index, test/checkout/payment/
  pull_request:
    types:
      - opened
      - closed
    branches:
      - main      # configures the workflow to only run on pull requests that target the main branch
    paths-ignore:
      - README.md     # workflow will only run when a pull request that includes a change on any file other than README.md

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo this workflow/job/step is executed for event type - ${{ github.event_name }}